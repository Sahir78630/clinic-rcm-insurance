<style>

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}

.chart svg{display:block;width:100%;height:auto}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

.stack{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--sunk);min-width:120px}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(880px, calc(100vw - 24px));max-height:calc(100vh - 32px)}

.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dlg-x{border:0;background:var(--sunk);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line);padding-left:14px}

@media (max-width:860px){

function totals(c){
  let gross=0,ps=0,net=0,paid=0;
  c.acts.forEach(a => { gross+=a.gross; ps+=a.ps; net+=a.net; paid+=a.paid||0; });
  const remitted = c.status === "Remitted" || c.status === "Resubmitted" || c.remits.length > 0;
  const denied = remitted ? Math.max(0, net - paid) : 0;
  const outstanding = Math.max(0, r2(net - paid - (c.writeOff||0)));
  return {gross:r2(gross),ps:r2(ps),net:r2(net),paid:r2(paid),denied:r2(denied),wo:c.writeOff||0,outstanding};
}

  return t.paid === 0 ? "Rejected" : "Partially paid";

const norm = s => String(s || "").replace(/[^0-9a-z]/gi, "").toLowerCase();
function verify(ptId, payerId, card, dept, pts){
  const list = pts || S.patients;
  let p = ptId ? list.find(x => x.id === ptId) : null;
  if (!p && card){ const k = norm(card); p = list.find(x => norm(x.policy.card) === k || norm(x.eid) === k); }
  const base = {payer:payerId || (p && p.policy.payer), card:card || (p && p.policy.card), dept};
  if (!p) return {...base,status:"Not found",input:card,msg:"This card number or Emirates ID is not in the clinic's member list. The site does not connect to payer systems yet, so a real member is found only after you register their policy here once."};
  const pol = p.policy;
  const res = {...base,payer:pol.payer,card:pol.card,patient:p.id,name:p.name,eid:p.eid,dob:p.dob,plan:pol.plan,network:pol.network,validFrom:pol.validFrom,validTo:pol.validTo,copay:pol.copay,ded:pol.ded};

function vbars(items, opts={}){

  const bw = iw/items.length;
  items.forEach((it,i) => {
    const x0 = pl + bw*i;
    const ser = it.series || [{v:it.v,color:it.color}];
    const inner = Math.min(46, bw*0.7), sw = inner/ser.length;
    ser.forEach((s,k) => { const h = ih*s.v/nice; g += `<rect x="${x0+(bw-inner)/2+sw*k}" y="${pt+ih-h}" width="${Math.max(1,sw-2)}" height="${h}" rx="2" fill="var(${s.color})"><title>${esc(it.label)}: AED ${aed(s.v)}</title></rect>`; });
    if (!it.series) g += `<text class="lbl" x="${x0+bw/2}" y="${pt+ih-ih*it.v/nice-5}" text-anchor="middle">${aedK(it.v)}</text>`;
    g += `<text x="${x0+bw/2}" y="${H-14}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"chart")}">${g}</svg></div>`;
}
function hbars(items, opts={}){
  const W=520,rowH=26,pl=opts.pl||130,pr=70,H=items.length*rowH+8;
  const max = Math.max(1,...items.map(i=>i.v));

  items.forEach((it,i) => { const y = 4+i*rowH, w = (W-pl-pr)*it.v/max;
    g += `<text class="lbl" x="${pl-8}" y="${y+16}" text-anchor="end">${esc(it.label)}</text><rect x="${pl}" y="${y+5}" width="${Math.max(1,w)}" height="15" rx="2" fill="var(${it.color||"--accent"})"><title>${esc(it.label)}: AED ${aed(it.v)}</title></rect><text x="${pl+w+6}" y="${y+16}">${opts.fmt?opts.fmt(it.v):aedK(it.v)}</text>`; });

function niceMax(v){ const p = Math.pow(10,Math.floor(Math.log10(v))); for (const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if (m*p >= v) return m*p; return 10*p; }

function resubState(x){
  if (!x.outcome) return "Awaiting payer";
  if (x.outcome.paid <= 0.009) return "Denied again";
  return x.outcome.denied > 0.009 ? "Partially recovered" : "Recovered";
}
const dtX = iso => iso.split("-").reverse().join("/");
function claimBlock(c, resub){
  const p = patient(c.patient), t = totals(c), x = c.resubs[c.resubs.length-1] || {type:"correction",note:""}, dt = dtX;
  return `  <Claim>
    <ID>${c.id}</ID>
    <MemberID>${esc(c.card)}</MemberID>
    <PayerID>${c.payer}</PayerID>
    <ProviderID>DHA-F-0000000</ProviderID>
    <EmiratesIDNumber>${esc(p.eid)}</EmiratesIDNumber>
    <Gross>${t.gross.toFixed(2)}</Gross>
    <PatientShare>${t.ps.toFixed(2)}</PatientShare>
    <Net>${t.net.toFixed(2)}</Net>
    <Encounter>
      <FacilityID>DHA-F-0000000</FacilityID>
      <Type>1</Type>
      <PatientID>${p.id}</PatientID>
      <Start>${dt(c.enc)} 09:00</Start>
    </Encounter>
${c.dx.map((d,i)=>`    <Diagnosis>
      <Type>${i?"Secondary":"Principal"}</Type>
      <Code>${d[0]}</Code>
    </Diagnosis>`).join("\n")}
${c.acts.map(a=>`    <Activity>
      <ID>${a.aid}</ID>
      <Start>${dt(c.enc)} 09:00</Start>
      <Type>${/^D\d/.test(a.code)?6:3}</Type>
      <Code>${a.code}</Code>
      <Quantity>${a.qty}</Quantity>
      <Net>${(resub ? r2(a.net-a.paid) : a.net).toFixed(2)}</Net>
      <Clinician>${esc(c.doctor)}</Clinician>${c.pa?`
      <PriorAuthorizationID>${c.pa}</PriorAuthorizationID>`:""}
    </Activity>`).join("\n")}${resub?`
    <Resubmission>
      <Type>${esc(x.type)}</Type>
      <Comment>${esc(x.note)}</Comment>
    </Resubmission>`:""}
  </Claim>`;
}
const xmlHeader = (receiver, count) => `  <Header>
    <SenderID>DHA-F-0000000</SenderID>
    <ReceiverID>${receiver}</ReceiverID>
    <TransactionDate>${dtX(TODAY)} ${nowTime()}</TransactionDate>
    <RecordCount>${count}</RecordCount>
    <DispositionFlag>PRODUCTION</DispositionFlag>
  </Header>`;
// one file per payer, as eClaimLink routes each file to the receiver in its header
function claimsXml(list, resub){
  return `<?xml version="1.0" encoding="utf-8"?>
<Claim.Submission>
${xmlHeader(list[0].payer, list.length)}
${list.map(c=>claimBlock(c,resub)).join("\n")}
</Claim.Submission>`;
}
const resubXml = c => claimsXml([c], true);
function priorRequestXml(a){

function applyPriorAuth(xml){
  const doc = new DOMParser().parseFromString(xml,"application/xml");
  const txt = (el,t) => { const x = el.getElementsByTagName(t)[0]; return x ? x.textContent.trim() : ""; };
  let n = 0;
  [...doc.getElementsByTagName("Authorization")].forEach(au => {
    const a = S.auths.find(x => x.id === txt(au,"ID")); if (!a) return;
    const yes = /^y/i.test(txt(au,"Result"));
    const paid = [...au.getElementsByTagName("Activity")].reduce((s,x)=>s+(parseFloat(txt(x,"PaymentAmount"))||0),0);
    a.status = !yes ? "Rejected" : paid > 0 && paid < a.requested - 0.009 ? "Partially approved" : "Approved";
    a.approved = yes ? r2(paid || a.requested) : 0;
    a.respOn = TODAY;
    const end = txt(au,"End").slice(0,10).split("/");
    a.validTo = !yes ? null : end.length === 3 ? `${end[2]}-${end[1]}-${end[0]}` : addDays(TODAY,30);
    a.note = [txt(au,"DenialCode"), txt(au,"Comments")].filter(Boolean).join(": ") + (txt(au,"IDPayer") ? ` (payer ref. ${txt(au,"IDPayer")})` : "");
    n++;
  });
  return n;
}

function agingBy(payerId, basis){
  const rows = {}, tot = [0,0,0,0,0];
  S.claims.forEach(c => {
    if (c.status === "Draft") return;
    if (payerId && c.payer !== payerId) return;
    const t = totals(c); if (t.outstanding <= 0) return;
    const b = bucketOf(ageOf(c,basis));
    const r = rows[c.payer] || (rows[c.payer] = {v:[0,0,0,0,0],total:0,n:0,overdue:0});
    r.v[b] += t.outstanding; r.total += t.outstanding; r.n++; tot[b] += t.outstanding;
    if (ageOf(c,"sub") > payer(c.payer).terms) r.overdue += t.outstanding;
  });
  return {rows,tot};
}

function apptSampleCsv(){

  ex.forEach((p,i) => rows.push([["08:30","09:15","10:00"][i],`"${p.name}"`,p.eid,payer(p.policy.payer).name,p.policy.card,p.policy.plan,p.policy.validTo,"General Practice",""].join(",")));
  rows.push(`11:30,"Example New Patient",784-1988-1234567-1,Daman,DM-555123-01,Gold,${addDays(TODAY,200)},Dermatology,`);
  return rows.join("\n");
}
function parseCsv(txt){
  const out = []; let row = [], cur = "", q = false;
  for (let i=0;i<txt.length;i++){ const ch = txt[i];
    if (q){ if (ch === '"'){ if (txt[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ","){ row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && txt[i+1] === "\n") i++; row.push(cur); out.push(row); row = []; cur = ""; }
    else cur += ch; }
  if (cur || row.length){ row.push(cur); out.push(row); }
  return out.filter(r => r.some(c => c.trim()));
}

function importAppts(txt, replace){
  const rows = parseCsv(txt); if (!rows.length) return "The list is empty.";
  let hdr = rows[0].map(h => h.trim().toLowerCase().replace(/[^a-z]+/g,"_"));
  const want = APPT_COLS.split(",");
  if (!hdr.includes("emirates_id") && !hdr.includes("card_no")) hdr = want; else rows.shift();
  const col = (r,k) => { const i = hdr.indexOf(k); return i < 0 ? "" : (r[i]||"").trim(); };
  const findPayer = v => { const k = norm(v); return PAYERS.find(p => norm(p.id) === k || norm(p.name) === k || norm(p.name).startsWith(k) || k.startsWith(norm(p.name))); };
  const appts = replace ? [] : S.appts.slice(); let added = 0, skipped = 0;
  rows.forEach((r,i) => {
    const eid = col(r,"emirates_id"), card = col(r,"card_no"), name = col(r,"patient_name");
    if (!eid && !card){ skipped++; return; }
    const k1 = norm(eid), k2 = norm(card);
    let p = S.patients.find(x => (k1 && norm(x.eid) === k1) || (k2 && norm(x.policy.card) === k2));
    const py = findPayer(col(r,"payer")), plan = PLANS.find(x => norm(x.name) === norm(col(r,"plan"))) || PLANS[1], vt = col(r,"valid_until");
    if (!p && py){
      p = {id:"P"+(20000+S.patients.length),name:name||"Unnamed patient",dob:"",eid,mobile:"",policy:{payer:py.id,plan:plan.name,card:card||"–",validFrom:addDays(vt||TODAY,-365),validTo:/^\d{4}-\d{2}-\d{2}$/.test(vt)?vt:addDays(TODAY,180),copay:plan.copay,ded:plan.ded,network:plan.network}};
      S.patients.push(p); added++;
    } else if (p && py && vt && /^\d{4}-\d{2}-\d{2}$/.test(vt)){ p.policy.payer = py.id; p.policy.validTo = vt; if (card) p.policy.card = card; }
    if (!p){ skipped++; return; }
    const dept = DEPTS[col(r,"department")] ? col(r,"department") : "General Practice";
    appts.push({id:"AP"+Date.now().toString(36)+i,time:col(r,"time")||"–",patient:p.id,dept,doctor:col(r,"doctor")||DEPTS[dept].dr[0],status:"Not verified",checked:null});
  });
  appts.sort((a,b)=>a.time.localeCompare(b.time));
  S.appts = appts;
  const n = appts.filter(a=>a.status==="Not verified"); n.forEach(doVerify);
  closeDlg(); current = "eligibility";
  done(`Imported ${rows.length - skipped} appointments and checked ${n.length}` + (added?`, ${added} new members added`:"") + (skipped?`. ${skipped} rows skipped (no ID or unknown payer)`:""));
  return null;
}

/* ---------- remittance import ---------- */
function sampleRaXml(){
  const cand = S.claims.filter(c=>c.status==="Submitted"||c.status==="Resubmitted").sort((a,b)=>a.submitted.localeCompare(b.submitted));
  if (!cand.length) return null;
  const pid = cand[0].payer;
  const pick = cand.filter(c=>c.payer===pid).slice(0,6);
  const ref = "TT"+(990000+S.raSeq);
  const lines = pick.map((c,i) => {
    const resub = c.status === "Resubmitted";
    return `  <Claim>
    <ID>${c.id}</ID>
    <IDPayer>${pid}${String(700000+i)}</IDPayer>
    <ProviderID>DHA-F-0000000</ProviderID>
    <PaymentReference>${ref}</PaymentReference>
    <DateSettlement>${TODAY.split("-").reverse().join("/")}</DateSettlement>
${c.acts.map((a,k)=>{ const due = resub ? r2(a.net-a.paid) : a.net; if (resub && due<=0) return ""; const deny = !resub && i===1 && k===c.acts.length-1;
  return `    <Activity>
      <ID>${a.aid}</ID>
      <Code>${a.code}</Code>
      <Quantity>${a.qty}</Quantity>
      <Net>${resub?due:a.net}</Net>
      <PaymentAmount>${deny?0:due}</PaymentAmount>${deny?`
      <DenialCode>MNEC-004</DenialCode>`:""}
    </Activity>`; }).filter(Boolean).join("\n")}
  </Claim>`; }).join("\n");
  return `<?xml version="1.0" encoding="utf-8"?>
<Remittance.Advice>
  <Header>
    <SenderID>${pid}</SenderID>
    <ReceiverID>DHA-F-0000000</ReceiverID>
    <TransactionDate>${TODAY.split("-").reverse().join("/")} 10:15</TransactionDate>
    <RecordCount>${pick.length}</RecordCount>
    <DispositionFlag>PRODUCTION</DispositionFlag>
  </Header>
${lines}
</Remittance.Advice>`;
}
function importRa(xml, opts={}){
  let doc;
  try { doc = new DOMParser().parseFromString(xml,"application/xml"); } catch(e) { return "Could not read the file."; }
  if (doc.querySelector("parsererror") || !doc.querySelector("Remittance\\.Advice, Claim")) return "This does not look like a Remittance.Advice XML file.";
  const txt = (el,tag) => { const x = el.getElementsByTagName(tag)[0]; return x ? x.textContent.trim() : ""; };
  const header = doc.getElementsByTagName("Header")[0];
  const sender = header ? txt(header,"SenderID") : "";
  const claimsEl = [...doc.getElementsByTagName("Claim")];
  if (!claimsEl.length) return "The file has no Claim records.";
  const lines = [], unknown = []; let total = 0, ref = "", pid = PAYERS.some(p=>p.id===sender) ? sender : null;
  claimsEl.forEach(ce => {
    const id = txt(ce,"ID"); const c = claimById(id);
    ref = ref || txt(ce,"PaymentReference");
    if (!c){ unknown.push(id); return; }
    pid = pid || c.payer;
    let paid = 0, denied = 0;
    [...ce.getElementsByTagName("Activity")].forEach(ae => {
      const aid = txt(ae,"ID"), code = txt(ae,"Code");
      const a = c.acts.find(x=>x.aid===aid) || c.acts.find(x=>x.code===code);
      if (!a) return;
      const pay = parseFloat(txt(ae,"PaymentAmount"))||0, net = parseFloat(txt(ae,"Net"))||a.net, den = txt(ae,"DenialCode");
      a.paid = r2(Math.min(a.net, (c.status==="Resubmitted" ? a.paid : 0) + pay));
      a.denial = a.paid >= a.net - 0.009 ? null : (den || a.denial || "PRCE-002");
      paid += pay; denied += Math.max(0, net - pay);
    });
    paid = r2(paid); denied = r2(denied); total += paid;
    const raId = `RA-${c.payer}-${TODAY.replace(/-/g,"")}-${S.raSeq}`;
    c.remits.push({ra:raId,d:TODAY,paid,denied}); c.remitDate = TODAY;
    if (c.status === "Resubmitted" && c.resubs.length){ const last = c.resubs[c.resubs.length-1]; if (!last.outcome) last.outcome = {d:TODAY,paid,denied,ra:raId}; }
    c.events.push({d:TODAY,t:`Remittance ${ref} imported: paid AED ${aed(paid)}`+(denied?`, denied AED ${aed(denied)}`:"")});
    c.status = "Remitted";
    lines.push({claim:c.id,paid,denied});
  });
  if (!lines.length) return `None of the ${claimsEl.length} claims in the file match claims in this system.`;
  const ra = {id:`RA-${pid}-${TODAY.replace(/-/g,"")}-${S.raSeq}`,payer:pid,date:TODAY,payRef:ref||"—",lines,amount:r2(total),bank:null,status:"Unreconciled",recOn:null,source:opts.source||"Imported file"};
  S.ras.unshift(ra); S.raSeq++;
  if (opts.quiet){ save(); return {total, count:lines.length, unknown}; }
  save(); render(); raDlg(ra.id);
  toast(`Posted AED ${aed(total)} to ${lines.length} claims`+(unknown.length?`. ${unknown.length} unmatched: ${unknown.join(", ")}`:""));
  return null;
}

  if (current==="approvals"){
    v.querySelectorAll("[data-pafilter]").forEach(b=>b.onclick=()=>{ UI.paFilter=b.dataset.pafilter; render(); });
    v.querySelectorAll("[data-paresp]").forEach(b=>b.onclick=()=>paRespDlg(b.dataset.paresp));
    $("#newPaBtn").onclick=()=>newPaDlg();
  }
  if (current==="claims"){
    const q=$("#fq"); q.oninput=()=>{ UI.claimQ=q.value; const pos=q.selectionStart; render(); const n=$("#fq"); n.focus(); n.setSelectionRange(pos,pos); };
    $("#fpayer").onchange=e=>{UI.claimPayer=e.target.value;render();};
    $("#fstatus").onchange=e=>{UI.claimStatus=e.target.value;render();};
    $("#fdept").onchange=e=>{UI.claimDept=e.target.value;render();};
    $("#submitDrafts").onclick=async e=>{ const d=S.claims.filter(c=>c.status==="Draft");
      if (!ECL()){ d.forEach(submitClaim); return done(`Submitted ${d.length} claims to payers`); }
      e.target.disabled=true; e.target.textContent="Sending to eClaimLink…";
      const byPayer = {}; d.forEach(c=>(byPayer[c.payer]=byPayer[c.payer]||[]).push(c));
      let sent=0; const fails=[];
      for (const [pid,list] of Object.entries(byPayer)){
        try { const r = await eclUpload(claimsXml(list,false)); list.forEach(c=>{ submitClaim(c); c.eclTx=r.transactionId; c.events.push({d:TODAY,t:`eClaimLink transaction ${r.transactionId||"–"}`}); }); sent+=list.length; }
        catch(err){ fails.push(`${payer(pid).name}: ${err.message}`); }
      }
      done(`Sent ${sent} claims to eClaimLink in ${Object.keys(byPayer).length-fails.length} files`+(fails.length?`. Failed: ${fails.join("; ")}`:"")); };
  }
  if (current==="remittance"){
    $("#sampleRa").onclick=()=>{ const x=sampleRaXml(); if(!x) return toast("No submitted claims are waiting for payment"); $("#raXml").value=x; $("#raMsg").textContent="Sample file loaded. Review it, then import."; };
    $("#raFile").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ $("#raXml").value=rd.result; $("#raMsg").textContent=f.name+" loaded."; }; rd.readAsText(f); };
    $("#importRa").onclick=()=>{ const x=$("#raXml").value.trim(); if(!x){ $("#raMsg").textContent="Paste or load a remittance file first."; return; } const err=importRa(x); if(err) $("#raMsg").textContent=err; };
  }
  if (current==="resubmissions"){ v.querySelectorAll("[data-rsfilter]").forEach(b=>b.onclick=()=>{ UI.rsFilter=b.dataset.rsfilter; render(); }); }
  if (current==="receivables"){
    v.querySelectorAll("[data-basis]").forEach(b=>b.onclick=()=>{ UI.arBasis=b.dataset.basis; try{localStorage.setItem(KEY+"-ui",JSON.stringify({arBasis:UI.arBasis}));}catch(e){} render(); });
    v.querySelectorAll("[data-arpayer]").forEach(el=>{ const f=()=>{ UI.arPayer=UI.arPayer===el.dataset.arpayer?"":el.dataset.arpayer; render(); }; el.onclick=f; el.onkeydown=e=>{ if(e.key==="Enter") f(); }; });
    $("#copyCsv").onclick=()=>{ const {rows,tot}=agingBy(null,UI.arBasis); const lines=[["Payer","Type",...BUCKETS.map(b=>b[0]+" days"),"Total","Past terms"].join(",")];
      PAYERS.filter(p=>rows[p.id]).forEach(p=>lines.push([`"${p.name}"`,p.kind,...rows[p.id].v.map(x=>x.toFixed(2)),rows[p.id].total.toFixed(2),rows[p.id].overdue.toFixed(2)].join(",")));
      lines.push(["Total","",...tot.map(x=>x.toFixed(2)),tot.reduce((a,b)=>a+b,0).toFixed(2),""].join(","));
      const csv=lines.join("\n");
      const fallback=()=>{ openDlg(dlgHead("Aging report CSV","Select all and copy")+`<div class="dlg-body"><textarea id="csvOut" readonly>${esc(csv)}</textarea></div>`); $("#csvOut").select(); };
      try { navigator.clipboard.writeText(csv).then(()=>toast("Aging report copied as CSV"),fallback); } catch(e){ fallback(); } };
  }
}

/* ---------- live backend (active only when served by the clinic server) ---------- */
const API_BASE = (document.querySelector('meta[name="rcm-api"]') || {}).content || null;
const LIVE = {on:false, provider:null, appts:[], log:[], ecl:null, eclFiles:[], eclLast:null};
const ECL = () => LIVE.on && LIVE.ecl && LIVE.ecl !== "off";
const eclLabel = () => LIVE.ecl === "live" ? "eClaimLink" : "eClaimLink (test mode)";
const refreshEcl = () => ECL() ? api("/eclaimlink/files?limit=15").then(f=>{ LIVE.eclFiles=f; if (["remittance"].includes(current)) render(); }).catch(()=>{}) : Promise.resolve();
async function eclUpload(xml){
  const r = await api("/eclaimlink/upload",{xml});
  refreshEcl();
  if (!r.ok) throw new Error(`eClaimLink did not accept the file (code ${r.resultCode}): ${r.errorMessage||"no message"}`);
  return r;
}
async function eclSync(btn){
  if (btn){ btn.disabled = true; btn.textContent = "Downloading…"; }
  try {
    const s = await api("/eclaimlink/sync",{});
    const files = await api("/eclaimlink/files?unapplied=1&limit=200");
    let ras=0, paid=0, claims=0, pas=0; const unknown=[], other=[];
    for (const f of files.slice().reverse()){
      if (f.type === "Remittance.Advice"){ const r = importRa(f.xml,{quiet:true,source:"eClaimLink "+f.file_name}); if (r && typeof r === "object"){ ras++; paid+=r.total; claims+=r.count; unknown.push(...r.unknown); } else if (r) unknown.push(f.file_name+": "+r); }
      else if (f.type === "Prior.Authorization"){ pas += applyPriorAuth(f.xml); }
      else other.push(f.type);
      await api(`/eclaimlink/files/${f.id}/applied`,{});
    }
    save(); LIVE.eclLast = new Date().toISOString(); await refreshEcl(); render();
    toast(files.length ? `Downloaded ${s.downloaded} new files. ${ras} remittances posted AED ${aed(paid)} to ${claims} claims`+(pas?`, ${pas} approval replies recorded`:"")+(unknown.length?`. Not matched: ${unknown.slice(0,4).join(", ")}${unknown.length>4?"…":""}`:"")+(s.errors.length?`. ${s.errors.length} files failed`:"")
      : "No new files on eClaimLink");
  } catch(e){ toast("eClaimLink download failed: " + e.message); render(); }
}
function eclPanel(){
  const f = LIVE.eclFiles;
  return `<section class="panel"><div class="panel-head"><div><h2>${eclLabel()}</h2><p>Claims, resubmissions and approval requests are sent from their pages. Download collects remittances and approval replies and posts them automatically.${LIVE.ecl==="mock"?" Test mode simulates the payer: each uploaded claim comes back as a remittance.":""}</p></div>
    <button class="btn primary" data-eclsync type="button">Download from eClaimLink</button></div>
    <div class="table-wrap"><table><thead><tr><th>Time</th><th></th><th>File</th><th>Type</th><th>From / to</th><th class="num">Records</th><th>Result</th></tr></thead><tbody>
    ${f.map(x=>`<tr class="click" data-eclfile="${x.id}" tabindex="0"><td class="mono muted">${esc((x.created_at||"").slice(5,16))}</td><td>${x.direction==="out"?"Sent":"Received"}</td><td class="mono">${esc(x.file_name||"")}</td><td><span class="code">${esc(x.type||"")}</span></td><td>${esc(x.direction==="out"?x.receiver:x.sender)}</td><td class="num">${x.record_count??"–"}</td><td>${x.direction==="out"?(x.result_code>=0?pill(x.result_code>0?"Accepted with warnings":"Accepted"):`<span class="pill p-bad">Rejected</span>`):pill(x.applied_at?"Posted":"Waiting")}${x.transaction_id?` <span class="muted mono">${esc(x.transaction_id)}</span>`:""}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">Nothing sent or received yet.</td></tr>`}
    </tbody></table></div></section>`;
}
async function eclFileDlg(id){
  try { const f = await api(`/eclaimlink/files/${id}`);
    openDlg(dlgHead(`<span class="mono" style="font-size:14px">${esc(f.file_name||"")}</span>`, `${f.direction==="out"?"Sent":"Received"} ${esc(f.created_at||"")} · ${esc(f.type||"")}${f.transaction_id?" · transaction "+esc(f.transaction_id):""}`) +
      `<div class="dlg-body">${f.error_message?`<div class="result ${f.result_code<0?"bad":"warn"}">${esc(f.error_message)}${f.error_report?`<pre style="white-space:pre-wrap;margin:6px 0 0" class="mono">${esc(f.error_report)}</pre>`:""}</div>`:""}<textarea readonly style="min-height:340px">${esc(f.xml||"")}</textarea></div>`);
  } catch(e){ toast(e.message); }
}
async function api(path, body){
  const r = await fetch(API_BASE + path, body === undefined ? {credentials:"same-origin"} : {method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || `Server returned ${r.status}`);
  return j;
}
const fromApi = r => ({status:r.status,msg:r.message,name:r.name,payer:r.payer,card:r.cardNo,eid:r.emiratesId,plan:r.plan,network:r.network,validFrom:r.validFrom,validTo:r.validTo,copay:r.copayPct,ded:r.deductible,dept:r.department,patient:null,input:r.emiratesId||r.cardNo,ref:r.reference});
const refreshLog = () => api("/checks?limit=30").then(l=>{ LIVE.log=l; if (current==="eligibility") render(); }).catch(()=>{});
function liveEligibility(){
  const v = UI.verifyResult, A = LIVE.appts;
  const timeOf = iso => iso ? new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : "–";
  return head("Eligibility & access",`Live checks through the clinic server. Eligibility source: <b>${esc(LIVE.provider==="http"?"payer / integration API":"clinic member records (test mode)")}</b>.`,
    `<button class="btn" id="importAppts" type="button">Import appointment list</button><button class="btn primary" id="lVerifyAll" type="button">Verify all remaining</button>`) +
  `<section class="panel"><div class="panel-head"><div><h2>Today's appointments</h2><p>${fmtD(TODAY)} · ${A.filter(a=>a.status!=="Not verified").length} of ${A.length} checked</p></div></div>
    <div class="table-wrap"><table><thead><tr><th>Time</th><th>Patient</th><th>Department</th><th>Payer</th><th>Card no.</th><th>Plan</th><th>Status</th><th>Checked</th><th></th></tr></thead><tbody>
    ${A.map(a=>`<tr><td class="mono">${esc(a.time||"–")}</td><td>${esc(a.patientName||(a.result&&a.result.name)||"–")}<div class="muted mono">${esc(a.emiratesId||"")}</div></td><td>${esc(a.department||"–")}<div class="muted">${esc(a.doctor||"")}</div></td><td>${esc(a.payer?payer(a.payer).name:"Any")}</td><td class="mono">${esc(a.cardNo||"–")}</td><td>${esc(a.result&&a.result.plan||"–")}</td><td>${pill(a.status)}</td><td class="mono muted">${timeOf(a.checkedAt)}</td><td><button class="btn sm" data-lverify="${a.id}" type="button">${a.status==="Not verified"?"Verify":"Re-check"}</button></td></tr>`).join("") || `<tr><td colspan="9" class="empty">No appointments for today yet. Import the day's list from your clinic system.</td></tr>`}
    </tbody></table></div></section>
  <div class="grid2">
    <section class="panel"><div class="panel-head"><div><h2>Walk-in member check</h2><p>Emirates ID or insurance card number. Leave the payer on "Any" to search every payer the source covers.</p></div></div>
      <form id="lVerifyForm" class="form-grid">
        <div class="field"><label for="vPayer">Payer</label><select id="vPayer"><option value="">Any payer</option>${PAYERS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>
        <div class="field"><label for="vCard">Emirates ID or card no.</label><input id="vCard" type="text" placeholder="784-1990-1234567-1" required></div>
        <div class="field"><label for="vDept">Service</label><select id="vDept">${Object.keys(DEPTS).map(d=>`<option>${esc(d)}</option>`).join("")}</select></div>
        <div class="field"><button class="btn primary" type="submit">Check eligibility</button></div>
      </form>
      ${v ? resultCard(v).replace(/data-regmember=/, LIVE.provider==="mock"?"data-regmember=":"hidden data-regmember=").replace(/<button class="btn sm primary" data-newpa[^>]*>[^<]*<\/button>/,"") : `<div class="empty">Results of a walk-in check appear here.</div>`}
    </section>
    <section class="panel"><div class="panel-head"><div><h2>Verification log</h2><p>Stored on the clinic server</p></div></div>
      <div class="table-wrap"><table><thead><tr><th>Time</th><th>Patient / ID</th><th>Payer</th><th>Result</th><th>Source</th></tr></thead><tbody>
      ${LIVE.log.map(l=>`<tr><td class="mono muted">${esc((l.created_at||"").slice(5,16))}</td><td>${esc(l.result&&l.result.name||l.emirates_id||l.card_no||"–")}</td><td>${esc(l.payer?payer(l.payer).name:"–")}</td><td>${pill(l.status)}</td><td class="muted">${esc(l.source)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">No checks yet.</td></tr>`}
      </tbody></table></div></section>
  </div>`;
}
function bindLive(v){
  $("#importAppts").onclick = apptImportDlg;
  $("#lVerifyAll").onclick = e => { e.target.disabled = true; e.target.textContent = "Checking…"; api("/appointments/verify-all",{}).then(r=>{ LIVE.appts=r.appointments; refreshLog(); render(); toast(`Checked ${r.checked} appointments`); }).catch(err=>{ toast(err.message); render(); }); };
  v.querySelectorAll("[data-lverify]").forEach(b=>b.onclick=()=>{ b.disabled=true; b.textContent="Checking…";
    api(`/appointments/${b.dataset.lverify}/verify`,{}).then(r=>Promise.all([r, api("/appointments")])).then(([r,list])=>{ LIVE.appts=list; refreshLog(); render(); openDlg(dlgHead("Eligibility result",esc(r.department||""))+`<div class="dlg-body">${resultCard(fromApi(r)).replace(/<div class="actions">[\s\S]*?<\/div>/g,"")}</div>`); }).catch(err=>{ toast(err.message); render(); }); });
  $("#lVerifyForm").onsubmit = e => { e.preventDefault(); const q=$("#vCard").value.trim(); const isEid=/^784\d{12}$/.test(norm(q));
    api("/eligibility",{emiratesId:isEid?q:null,cardNo:isEid?null:q,payer:$("#vPayer").value||null,department:$("#vDept").value}).then(r=>{ UI.verifyResult=fromApi(r); refreshLog(); render(); }).catch(err=>toast(err.message)); };
}
async function bootLive(){
  try {
    const [h, appts, log] = await Promise.all([api("/health"), api("/appointments"), api("/checks?limit=30")]);
    Object.assign(LIVE, {on:true, provider:h.provider, appts, log, ecl:h.eclaimlink||"off"});
    await refreshEcl();
    UI.verifyResult = null; render();
  } catch(e) { toast("Clinic server not reachable: " + e.message); }
}

/* ---------- boot ---------- */
$("#nav").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });
let resetArm = 0;
$("#resetBtn").onclick = () => { const b = $("#resetBtn"); if (Date.now()-resetArm < 4000){ S = seed(); UI.verifyResult=null; save(); render(); b.textContent="Reset sample data"; toast("Sample data restored"); resetArm=0; } else { resetArm = Date.now(); b.textContent = "Click again to confirm"; setTimeout(()=>{ b.textContent="Reset sample data"; }, 4000); } };
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h!==current && R[h]) { current = h; render(); } });
save(); render();
if (API_BASE) bootLive();
})();
</script>
