<style>
/* Layout: operations console. Fixed left rail of work areas, main column of summary then detail; rail collapses to a scrolling tab strip on phones. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#EAF0EE; --ink:#13201E; --muted:#5A6B67; --line:#D8E1DE;
  --accent:#0D6B61; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --ok:#1D7A45; --ok-soft:#DFF2E6; --warn:#9A5B00; --warn-soft:#FBEED6; --bad:#B0281F; --bad-soft:#FBE3E0; --info:#2B5BA6; --info-soft:#E1EAF8; --dx:#6D3FB5; --dx-soft:#EEE6FA; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --b1:#8FCDBF; --b2:#E6C267; --b3:#E39549; --b4:#CC5B33; --b5:#8E2620;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1413; --surface:#151D1B; --sunk:#111917; --ink:#E3ECE9; --muted:#93A4A0; --line:#27332F;
  --accent:#4CC2AE; --accent-ink:#04201B; --accent-soft:#143530;
  --ok:#5ACB89; --ok-soft:#173326; --warn:#E6AA46; --warn-soft:#3A2C12; --bad:#F27D70; --bad-soft:#3E1D1A; --info:#82A8EC; --info-soft:#1A2740; --dx:#B99AF2; --dx-soft:#2A1F40; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --b1:#5FAE9E; --b2:#D7B154; --b3:#DE8B45; --b4:#D8643F; --b5:#B8433A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1413; --surface:#151D1B; --sunk:#111917; --ink:#E3ECE9; --muted:#93A4A0; --line:#27332F;
  --accent:#4CC2AE; --accent-ink:#04201B; --accent-soft:#143530;
  --ok:#5ACB89; --ok-soft:#173326; --warn:#E6AA46; --warn-soft:#3A2C12; --bad:#F27D70; --bad-soft:#3E1D1A; --info:#82A8EC; --info-soft:#1A2740; --dx:#B99AF2; --dx-soft:#2A1F40; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --b1:#5FAE9E; --b2:#D7B154; --b3:#DE8B45; --b4:#D8643F; --b5:#B8433A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-0.01em}
h1{font-size:24px} h2{font-size:17px} h3{font-size:15px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%;background:linear-gradient(to right, var(--surface) 231px, var(--line) 231px, var(--line) 232px, var(--bg) 232px)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.brand b{font-family:var(--display);font-size:15px;display:block;line-height:1.15}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:14px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group .eyebrow{padding:0 8px 4px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;font-weight:500;color:var(--ink)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .count{font-family:var(--mono);font-size:11px;background:var(--sunk);color:var(--muted);border-radius:10px;padding:1px 7px}
.nav button[aria-current="page"] .count{background:var(--surface);color:var(--accent)}
.rail-foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:0 6px;display:flex;flex-direction:column;gap:8px}

.print-only{display:none}
@media print{
  .rail,.toast,button,.btn,form,.filters{display:none !important}
  body{background:#fff}
  body[data-print="report"] #view > *:not(#eclReport){display:none !important}
  body[data-print="rep"] .rep-bar{display:none !important}
  .print-only{display:block !important}
  @page{size:A4 landscape;margin:10mm}
  body[data-print="rep"] table{font-size:10px}
  body[data-print="rep"] main{padding:0 !important}
  .panel,.kpi,tr{break-inside:avoid}
  .table-wrap{overflow:visible !important}
  .grid2{display:grid !important;grid-template-columns:1fr 1fr !important}
  .app{display:block !important}
}
main{min-width:0;padding-block:22px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

.queues{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.queue{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.queue:hover{border-color:var(--accent)}
.queue b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.queue span{font-size:12.5px;color:var(--muted)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;background:var(--sunk);position:sticky;top:0}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap-cell{white-space:normal;min-width:180px}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:600;background:var(--sunk);border-top:1px solid var(--line);border-bottom:0}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-dx{background:var(--dx-soft);color:var(--dx)}
.p-mute{background:var(--sunk);color:var(--muted)}
.code{font-family:var(--mono);font-size:11.5px;background:var(--sunk);border-radius:4px;padding:1px 6px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.ddmm{position:relative;display:flex;align-items:stretch;gap:4px;min-width:0}
.ddmm input[type=text]{flex:1 1 auto;width:100%;min-width:0}
.ddmm input[type=date]{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;padding:0;border:0}
.ddmm-cal{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 8px;cursor:pointer;font-size:14px;line-height:1}
.ddmm-cal:disabled{opacity:.5;cursor:default}
.cal{position:absolute;z-index:50;top:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px;width:260px;color:var(--ink,inherit)}
.cal-head{display:flex;align-items:center;gap:2px;margin-bottom:6px}.cal-head b{flex:1;text-align:center;font-size:13.5px}
.cal button{background:none;border:0;border-radius:6px;cursor:pointer;color:inherit;font:inherit;padding:5px 0}
.cal-head button{width:26px;font-size:15px}.cal button:hover:not(:disabled){background:var(--sunk)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px}.cal-grid i{font-style:normal;font-size:11px;color:var(--muted);padding:3px 0}
.cal-grid button.today{outline:1px solid var(--accent);outline-offset:-1px}.cal-grid button.on{background:var(--accent);color:#fff}
.cal button:disabled{opacity:.3;cursor:default}
.cal-foot{display:flex;justify-content:space-between;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}.cal-foot button{padding:4px 10px;color:var(--accent);font-weight:600;font-size:12.5px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;font-family:var(--mono);font-size:12px;min-height:150px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;align-items:end}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.result{border-radius:var(--r);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.result.ok{border-color:var(--ok);background:var(--ok-soft)}
.result.bad{border-color:var(--bad);background:var(--bad-soft)}
.result.warn{border-color:var(--warn);background:var(--warn-soft)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px}
.kv div{display:flex;flex-direction:column;gap:1px}
.kv dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:500}

.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart .lbl{fill:var(--ink);font-weight:500}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stack{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--sunk);min-width:120px}
.stack span{display:block;height:100%}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(880px, calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(8,16,14,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dlg-x{border:0;background:var(--sunk);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line);padding-left:14px}
.timeline li{position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50;max-width:calc(100vw - 32px)}
.empty{padding:22px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--bg)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;height:auto;flex-direction:row;align-items:center;padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:12px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .brand span,.rail-foot,.nav-group .eyebrow{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav-group{flex-direction:row}
  .nav button{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  const pol = p.policy;

function ddmmDates(root){

    nat.dataset.ddmm = "1";
    const wrap = document.createElement("span"); wrap.className = "ddmm";
    const txt = Object.assign(document.createElement("input"), {type:"text", placeholder:"dd/mm/yy", value:nat.value ? fmtD(nat.value) : "", disabled:nat.disabled, inputMode:"numeric", autocomplete:"off"});

    const btn = Object.assign(document.createElement("button"), {type:"button", className:"ddmm-cal", title:"Choose on calendar", disabled:nat.disabled, textContent:"📅"});
    nat.parentNode.insertBefore(wrap, nat); wrap.append(txt, btn, nat);
    const set = iso => { if (nat.value === iso) return; nat.value = iso; nat.dispatchEvent(new Event("input", {bubbles:true})); nat.dispatchEvent(new Event("change", {bubbles:true})); };

}
// A small month calendar under a date box. Weeks start on Monday; dates outside the box's min/max are greyed out.

  calEl = Object.assign(document.createElement("div"), {className:"cal"}); calEl.owner = wrap; calEl.txt = txt;

    let cells = "";
    for (let i = 0; i < first; i++) cells += `<span></span>`;
    for (let d = 1; d <= days; d++){ const iso = toISO(new Date(y, m, d)), off = (min && iso < min) || (max && iso > max);
      cells += `<button type="button" data-d="${iso}" class="${iso===sel?"on":""} ${iso===TODAY?"today":""}" ${off?"disabled":""}>${d}</button>`; }
    calEl.innerHTML = `<div class="cal-head"><button type="button" data-nav="-12" aria-label="Previous year">«</button><button type="button" data-nav="-1" aria-label="Previous month">‹</button>
      <b>${view.toLocaleDateString("en-GB",{month:"long", year:"numeric"})}</b><button type="button" data-nav="1" aria-label="Next month">›</button><button type="button" data-nav="12" aria-label="Next year">»</button></div>
      <div class="cal-grid">${["Mo","Tu","We","Th","Fr","Sa","Su"].map(w=>`<i>${w}</i>`).join("")}${cells}</div>
      <div class="cal-foot"><button type="button" data-d="${TODAY}" ${(min && TODAY < min) || (max && TODAY > max) ? "disabled" : ""}>Today</button><button type="button" data-clear>Clear</button></div>`;
    calEl.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + Number(b.dataset.nav), 1); draw(); });

    <div style="display:grid;gap:6px;font-size:13px">${items.map(i=>`<div><i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(${i.color})"></i>${esc(i.label)} <b>${fmt(i.v)}</b> <span class="muted">${total?(100*i.v/total).toFixed(1):"0.0"}%</span></div>`).join("")}</div></div>`;
}
function pieHtml(nMonths){
  const months = claimsActivity(nMonths), from = months[0].key;
  const subs = S.claims.filter(c => c.submitted && c.submitted.slice(0,7) >= from);
  const amt = {paid:0, denied:0, wait:0}, cnt = {"Paid":0,"Partially paid":0,"Rejected":0,"Awaiting payer":0};
  for (const c of subs){
    const t = totals(c); amt.paid += t.paid; amt.denied += t.denied; amt.wait += Math.max(0, t.net - t.paid - t.denied);
    const st = status(c); cnt[st === "Paid" || st === "Closed" ? "Paid" : st === "Partially paid" ? "Partially paid" : st === "Rejected" ? "Rejected" : "Awaiting payer"]++;
  }
  const money = v => "AED " + aed(v);
  return `<div class="grid2" style="margin-top:12px">
    <div><h3 style="margin:4px 0 8px">Submitted amount: where it stands</h3>${pie([{label:"Paid",v:r2(amt.paid),color:"--s3"},{label:"Denied",v:r2(amt.denied),color:"--s4"},{label:"Awaiting payment",v:r2(amt.wait),color:"--s1"}],{fmt:money,center:aedK(amt.paid+amt.denied+amt.wait),centerSub:"AED submitted",label:"Submitted amount by outcome"})}</div>
    <div><h3 style="margin:4px 0 8px">Claims by status</h3>${pie([{label:"Paid",v:cnt["Paid"],color:"--s3"},{label:"Partially paid",v:cnt["Partially paid"],color:"--s2"},{label:"Rejected",v:cnt["Rejected"],color:"--s4"},{label:"Awaiting payer",v:cnt["Awaiting payer"],color:"--s1"}],{centerSub:"claims",label:"Claims by status"})}</div>
  </div>`;
}

function applyPriorAuth(xml){
  const doc = new DOMParser().parseFromString(xml,"application/xml");
  const txt = (el,t) => { const x = el.getElementsByTagName(t)[0]; return x ? x.textContent.trim() : ""; };
  let n = 0;
  [...doc.getElementsByTagName("Authorization")].forEach(au => {
    const a = S.auths.find(x => x.id === txt(au,"ID")); if (!a) return;
    const yes = /^y/i.test(txt(au,"Result"));
    const paid = [...au.getElementsByTagName("Activity")].reduce((s,x)=>s+(parseFloat(txt(x,"PaymentAmount"))||0),0);
    a.status = !yes ? "Rejected" : paid > 0 && paid < a.requested - 0.009 ? "Partially approved" : "Approved";
    a.approved = yes ? r2(paid || a.requested) : 0;
    a.respOn = TODAY;
    const end = txt(au,"End").slice(0,10).split("/");
    a.validTo = !yes ? null : end.length === 3 ? `${end[2]}-${end[1]}-${end[0]}` : addDays(TODAY,30);
    a.note = [txt(au,"DenialCode"), txt(au,"Comments")].filter(Boolean).join(": ") + (txt(au,"IDPayer") ? ` (payer ref. ${txt(au,"IDPayer")})` : "");
    n++;
  });
  return n;
}

function agingBy(payerId, basis){
  const rows = {}, tot = [0,0,0,0,0];
  S.claims.forEach(c => {
    if (c.status === "Draft") return;
    if (payerId && c.payer !== payerId) return;
    const t = totals(c); if (t.outstanding <= 0) return;
    const b = bucketOf(ageOf(c,basis));
    const r = rows[c.payer] || (rows[c.payer] = {v:[0,0,0,0,0],total:0,n:0,overdue:0});
    r.v[b] += t.outstanding; r.total += t.outstanding; r.n++; tot[b] += t.outstanding;
    if (ageOf(c,"sub") > payer(c.payer).terms) r.overdue += t.outstanding;
  });
  return {rows,tot};
}

  urine:"urinary, kidney, abdominal or pregnancy",chest:"respiratory, cardiac or screening",abdomen:"abdominal, digestive or kidney",pregnancy:"pregnancy",cervix:"cervical screening or gynaecological",

  wart:"wart or benign skin lesion",skinBiopsy:"skin lesion",dental:"dental (K00–K14)"};
function dxMismatch(acts, dxList){
  const k = d => d.toUpperCase().replace(/\./g,""), dx = dxList.map(k), out = [];
  for (const a of acts){
    const code = (a.code||"").toUpperCase(), g = DX_FOR_CPT[code] || (/^D\d{4}$/.test(code) ? "dental" : null);
    if (!g || !dx.length) continue;
    if (!dx.some(d => DX_GROUPS[g].some(p => d.startsWith(p))))
      out.push(`${code}${a.desc?" "+a.desc:""} is not supported by the diagnoses on the claim (${dxList.join(", ")}). Expected a ${DX_GROUP_NAME[g]} diagnosis.`);
  }
  return out;
}
// ICD-10-CM Excludes1 pairs: the two conditions cannot be coded together on one claim.
// Prefix match without the dot ("R10" covers R10.0, R10.30 …). A common outpatient selection, not the full list.
const EXCLUDES1 = [
  ["R10","N23","renal colic is coded with N23, not as abdominal pain"],

  ["R10","R14","flatulence and related conditions"],

  ["J06","J22","acute respiratory infection NOS"],["J06","J020","streptococcal pharyngitis"],["J06","J09",""],["J06","J10",""],["J06","J11","influenza"],
  ["J00","J02","acute pharyngitis"],["J00","J30","allergic rhinitis"],["J00","J310","rhinitis NOS"],

  ["R05","J410","smoker's cough"],["R05","R042","cough with haemorrhage"],
  ["Z34","O","complications of pregnancy are coded in chapter O"],
  ["Z000","Z02","examination for administrative purposes"],

function excludes1(dxList){
  const k = d => d.toUpperCase().replace(/\./g,""), found = [];
  for (const [a,b,why] of EXCLUDES1){
    const x = dxList.filter(d => k(d).startsWith(a)), y = dxList.filter(d => k(d).startsWith(b) && !x.includes(d));
    if (x.length && y.length) found.push(`${x.join(", ")} and ${y.join(", ")} cannot be coded together (ICD-10 Excludes1${why?": "+why:""}). Keep the more specific code.`);
  }

const isServiceCode = a => ["5","8","9","10"].includes(String(a.type||"")) || OTHER_CODE.test(a.code||"");
function paDepartments(){
  const fromServer = LIVE.cfg && LIVE.cfg.approvalDepartments;
  return fromServer && fromServer.length ? fromServer : Object.keys(DEPTS).filter(d => DEPTS[d].pa);

function checkClaim(c){
  const out = [], err = (code, msg, lab) => out.push({level:"error", code, msg, lab}), warn = (code, msg, lab) => out.push({level:"warn", code, msg, lab});
  const p = patient(c.patient), pol = p.policy || {};
  if (!c.card) err("ELIG-001","Member card number is missing.");
  if (!p.eid) warn("ELIG-001","Emirates ID is missing.");
  else if (!/^784\d{12}$/.test(norm(p.eid))) warn("ELIG-001",`Emirates ID ${p.eid} is not 15 digits starting with 784.`);
  if (pol.payer && pol.payer !== c.payer) warn("ELIG-001",`Patient's insurance is with ${payer(pol.payer).name}, but the claim goes to ${payer(c.payer).name}.`);
  if (pol.validTo && c.enc > pol.validTo) err("ELIG-005",`Coverage ended ${fmtD(pol.validTo)}, before the visit on ${fmtD(c.enc)}.`);
  if (pol.validFrom && c.enc < pol.validFrom) err("ELIG-005",`Coverage starts ${fmtD(pol.validFrom)}, after the visit on ${fmtD(c.enc)}.`);
  if (c.enc > TODAY) err("CLAI-012","Encounter date is in the future.");
  else if (c.status === "Draft" && diff(c.enc, TODAY) > SUBMIT_LIMIT_DAYS) warn("CLAI-012",`Visit was ${diff(c.enc, TODAY)} days ago. Many payer contracts allow ${SUBMIT_LIMIT_DAYS} days; check this payer's limit.`);
  if (!c.doctor) warn("","Clinician is missing.");
  const dx = (c.dx || []).map(d => (d[0] || "").trim()).filter(Boolean);
  if (!dx.length) err("CODE-010","No diagnosis code.");
  dx.filter(d => !ICD10.test(d)).forEach(d => err("CODE-010",`Diagnosis ${d} is not a valid ICD-10 code.`));
  excludes1(dx).forEach(m => err("CODE-010", m));
  dxMismatch(c.acts, dx).forEach(m => out.push({level:"error", code:"MNEC-004", msg:m, dx:true}));
  if (!c.acts.length) err("","The claim has no activities.");
  c.acts.forEach(a => {
    const tag = `Activity ${a.code || a.aid}`;
    if (!a.code) err("CODE-010",`${a.aid}: activity code is missing.`);
    else if (!ACT_CODE.test(a.code) && !isServiceCode(a)) warn("CODE-010",`${tag}: code format is not CPT, HCPCS, dental, drug or Dubai service code.`);
    if (!(a.qty >= 1)) err("",`${tag}: quantity must be at least 1.`);
    if (a.gross < 0) err("",`${tag}: gross amount is negative.`);
    if (a.ps > a.gross) err("",`${tag}: patient share is more than the gross amount.`);
  });
  priceIssues(c).forEach(i => out.push(i));
  const pr = paRule(c);
  if (pr && !c.pa) err("AUTH-001", `${payerText(pr.k)} needs an approval code on ${pr.scope === "dental" ? "dental claims" : "every claim, including consultations"}. Enter it below or with Correct claim.`);
  const ol = outLabActs(c);
  if (ol.length) err("", `${ol.length} lab test${ol.length===1?"":"s"} (${ol.map(a => a.code).join(", ")}, AED ${aed(ol.reduce((x,a) => x + a.net, 0))}) ${ol.length===1?"is":"are"} outsourced for ${payerText(outLabRule(c))}. Remove ${ol.length===1?"it":"them"} with Remove outsourced lab before submitting.`);
  // Lab tests (CPT 80000–89999) carry their result as an <Observation> in the claim file.
  // Results are required for the tests in RESULT_REQUIRED; for other lab tests a missing result is a warning.
  c.acts.filter(a => Array.isArray(a.obs) && /^8\d{4}$/.test(a.code || "")).forEach(a => {
    const req = RESULT_REQUIRED[a.code], n = a.obs.filter(o => o.value).length;
    if (!n) (req ? err : warn)("",`Report missing: ${req ? `${req[0]} (${a.code})` : "lab test " + a.code} has no result in the claim file.`, true);
    else if (req && n < req[1]) warn("",`Report incomplete: ${req[0]} (${a.code}) has ${n} result${n===1?"":"s"}, ${req[1]} expected (${req[2]}).`, true);
  });
  const codes = new Set(c.acts.map(a => a.code).filter(Boolean));
  if (c.acts.length !== codes.size) warn("DUPL-002","The same activity code appears more than once. Use quantity instead if it is the same service.");
  const dup = S.claims.find(o => o.id !== c.id && o.patient === c.patient && o.enc === c.enc && o.acts.some(a => codes.has(a.code)));
  if (dup) err("DUPL-002",`Claim ${dup.id} already bills the same service for this patient on ${fmtD(c.enc)}.`);
  if (paDepartments().includes(c.dept)) {
    const pa = c.pa && S.auths.find(x => x.id === c.pa);
    if (!c.pa){ if (!paRule(c)) err("AUTH-001",`${c.dept} usually needs prior approval, and no approval number is on the claim.`); }
    else if (pa && /Rejected/.test(pa.status)) err("AUTH-001",`Prior approval ${c.pa} was rejected.`);
    else if (pa && pa.status === "Pending") warn("AUTH-001",`Prior approval ${c.pa} is still waiting for the payer.`);
    else if (pa && pa.validTo && c.enc > pa.validTo) err("AUTH-003",`Prior approval ${c.pa} expired ${fmtD(pa.validTo)}.`);
  }
  return out;
}
// "Report missing" (blue) when the only blocking problem is a missing lab result
// Colour groups: red errors, violet diagnosis–CPT mismatches, blue missing lab reports
const checkState = c => { const r = checkClaim(c), e = r.filter(x => x.level === "error");
  return e.some(x => !x.lab && !x.dx) ? "Errors" : e.some(x => x.dx) ? "Dx mismatch" : e.length ? "Report missing" : r.length ? "Warnings" : "Ready"; };
const blocked = c => ["Errors","Dx mismatch","Report missing"].includes(checkState(c));
const issueHtml = x => x.dx ? `<div style="color:var(--dx);font-weight:600">✕ ${esc(x.msg)} <span class="code" title="${esc(DENIALS[x.code]||"")}">${x.code}</span></div>`
  : x.lab ? `<div style="color:var(--info);font-weight:600">${x.level==="error"?"✕":"!"} ${esc(x.msg)}</div>`
  : `<div>${x.level === "error" ? "<b>✕</b>" : "!"} ${esc(x.msg)}${x.code ? ` <span class="code" title="${esc(DENIALS[x.code]||"")}">${x.code}</span>` : ""}</div>`;
function checkHtml(c){
  const r = checkClaim(c);
  if (!r.length) return `<div class="result ok"><b>Claim check passed.</b> No problems found.</div>`;
  const e = r.filter(x => x.level === "error"), w = r.filter(x => x.level === "warn");
  return `<div class="result ${e.length ? "bad" : "warn"}"><b>Claim check: ${e.length} error${e.length===1?"":"s"}, ${w.length} warning${w.length===1?"":"s"}</b>
    ${r.map(issueHtml).join("")}</div>`;
}

const APPT_COLS = "time,patient_name,emirates_id,payer,card_no,plan,valid_until,department,doctor";
function parseCsv(txt){
  const out = []; let row = [], cur = "", q = false;
  for (let i=0;i<txt.length;i++){ const ch = txt[i];
    if (q){ if (ch === '"'){ if (txt[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ","){ row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && txt[i+1] === "\n") i++; row.push(cur); out.push(row); row = []; cur = ""; }
    else cur += ch; }
  if (cur || row.length){ row.push(cur); out.push(row); }
  return out.filter(r => r.some(c => c.trim()));
}

function importAppts(txt, replace){
  const rows = parseCsv(txt); if (!rows.length) return "The list is empty.";
  let hdr = rows[0].map(h => h.trim().toLowerCase().replace(/[^a-z]+/g,"_"));
  const want = APPT_COLS.split(",");
  if (!hdr.includes("emirates_id") && !hdr.includes("card_no")) hdr = want; else rows.shift();
  const col = (r,k) => { const i = hdr.indexOf(k); return i < 0 ? "" : (r[i]||"").trim(); };
  const findPayer = v => { const k = norm(v); return PAYERS.find(p => norm(p.id) === k || norm(p.name) === k || norm(p.name).startsWith(k) || k.startsWith(norm(p.name))); };
  const appts = replace ? [] : S.appts.slice(); let added = 0, skipped = 0;
  rows.forEach((r,i) => {
    const eid = col(r,"emirates_id"), card = col(r,"card_no"), name = col(r,"patient_name");
    if (!eid && !card){ skipped++; return; }
    const k1 = norm(eid), k2 = norm(card);
    let p = S.patients.find(x => (k1 && norm(x.eid) === k1) || (k2 && norm(x.policy.card) === k2));
    const py = findPayer(col(r,"payer")), plan = PLANS.find(x => norm(x.name) === norm(col(r,"plan"))) || PLANS[1], vt = col(r,"valid_until");
    if (!p && py){
      p = {id:"P"+(20000+S.patients.length)+(SHARED?"-"+Date.now().toString(36).slice(-4)+i:""),name:name||"Unnamed patient",dob:"",eid,mobile:"",policy:{payer:py.id,plan:plan.name,card:card||"–",validFrom:addDays(vt||TODAY,-365),validTo:/^\d{4}-\d{2}-\d{2}$/.test(vt)?vt:addDays(TODAY,180),copay:plan.copay,ded:plan.ded,network:plan.network}};
      S.patients.push(p); added++;
    } else if (p && py && vt && /^\d{4}-\d{2}-\d{2}$/.test(vt)){ p.policy.payer = py.id; p.policy.validTo = vt; if (card) p.policy.card = card; }
    if (!p){ skipped++; return; }
    const dept = DEPTS[col(r,"department")] ? col(r,"department") : "General Practice";
    appts.push({id:"AP"+Date.now().toString(36)+i,time:col(r,"time")||"–",patient:p.id,dept,doctor:col(r,"doctor")||DEPTS[dept].dr[0],status:"Not verified",checked:null});
  });
  appts.sort((a,b)=>a.time.localeCompare(b.time));
  S.appts = appts;
  const n = appts.filter(a=>a.status==="Not verified"); n.forEach(doVerify);
  closeDlg(); current = "eligibility";
  done(`Imported ${rows.length - skipped} appointments and checked ${n.length}` + (added?`, ${added} new members added`:"") + (skipped?`. ${skipped} rows skipped (no ID or unknown payer)`:""));
  return null;
}

function doVerify(ap){
  const res = verify(ap.patient,null,null,ap.dept);
  ap.status = res.status; ap.checked = nowTime();
  S.log.unshift({t:TODAY+" "+ap.checked,pt:ap.patient,payer:res.payer,card:res.card,status:res.status,src:"Appointment"});
  return res;
}

/* ---------- remittance import ---------- */
function importRa(xml, opts={}){
  let doc;
  try { doc = new DOMParser().parseFromString(xml,"application/xml"); } catch(e) { return "Could not read the file."; }
  if (doc.querySelector("parsererror") || !doc.querySelector("Remittance\\.Advice, Claim")) return "This does not look like a Remittance.Advice XML file.";
  const txt = (el,tag) => { const x = el.getElementsByTagName(tag)[0]; return x ? x.textContent.trim() : ""; };
  const header = doc.getElementsByTagName("Header")[0];
  const sender = header ? txt(header,"SenderID") : "";
  const claimsEl = [...doc.getElementsByTagName("Claim")];
  if (!claimsEl.length) return "The file has no Claim records.";
  const lines = [], unknown = []; let total = 0, ref = "", pid = PAYERS.some(p=>p.id===sender) ? sender : null;
  claimsEl.forEach(ce => {
    const id = txt(ce,"ID"); const c = claimById(id);
    ref = ref || txt(ce,"PaymentReference");
    if (!c){ unknown.push(id); return; }
    pid = pid || c.payer;
    let paid = 0, denied = 0;
    [...ce.getElementsByTagName("Activity")].forEach(ae => {
      const aid = txt(ae,"ID"), code = txt(ae,"Code");
      const a = c.acts.find(x=>x.aid===aid) || c.acts.find(x=>x.code===code);
      if (!a) return;
      const pay = parseFloat(txt(ae,"PaymentAmount"))||0, net = parseFloat(txt(ae,"Net"))||a.net, den = txt(ae,"DenialCode");
      a.paid = r2(Math.min(a.net, (c.status==="Resubmitted" ? a.paid : 0) + pay));
      a.denial = a.paid >= a.net - 0.009 ? null : (den || a.denial || "PRCE-002");
      paid += pay; denied += Math.max(0, net - pay);
    });
    paid = r2(paid); denied = r2(denied); total += paid;
    const raId = `RA-${c.payer}-${TODAY.replace(/-/g,"")}-${S.raSeq}`;
    c.remits.push({ra:raId,d:TODAY,paid,denied}); c.remitDate = TODAY;
    if (c.status === "Resubmitted" && c.resubs.length){ const last = c.resubs[c.resubs.length-1]; if (!last.outcome) last.outcome = {d:TODAY,paid,denied,ra:raId}; }
    c.events.push({d:TODAY,t:`Remittance ${ref} imported: paid AED ${aed(paid)}`+(denied?`, denied AED ${aed(denied)}`:"")});
    c.status = "Remitted";
    lines.push({claim:c.id,paid,denied});
  });
  if (!lines.length) return `None of the ${claimsEl.length} claims in the file match claims in this system.`;
  const ra = {id:`RA-${pid}-${TODAY.replace(/-/g,"")}-${S.raSeq}`,payer:pid,date:TODAY,payRef:ref||"—",lines,amount:r2(total),bank:null,status:"Unreconciled",recOn:null,source:opts.source||"Imported file"};
  S.ras.unshift(ra); S.raSeq++;
  if (opts.quiet){ save(); return {total, count:lines.length, unknown}; }
  save(); render(); raDlg(ra.id);
  toast(`Posted AED ${aed(total)} to ${lines.length} claims`+(unknown.length?`. ${unknown.length} unmatched: ${unknown.join(", ")}`:""));
  return null;
}

async function eclSync(btn){
  if (btn){ btn.disabled = true; btn.textContent = "Downloading…"; }
  try {
    const s = await api("/eclaimlink/sync",{});
    const files = await api("/eclaimlink/files?unapplied=1&limit=200");
    let ras=0, paid=0, claims=0, pas=0; const unknown=[], other=[];
    for (const f of files.slice().reverse()){
      if (f.file_id && S.posted[f.file_id]){ /* already added from the eClaimLink files page */ }
      else if (f.type === "Remittance.Advice"){ const r = importRa(f.xml,{quiet:true,source:"eClaimLink "+f.file_name}); if (r && typeof r === "object"){ ras++; paid+=r.total; claims+=r.count; unknown.push(...r.unknown); } else if (r) unknown.push(f.file_name+": "+r); }
      else if (f.type === "Prior.Authorization"){ pas += applyPriorAuth(f.xml); }
      else other.push(f.type);
      if (f.file_id) S.posted[f.file_id] = TODAY;
      await api(`/eclaimlink/files/${f.id}/applied`,{});
    }
    save(); LIVE.eclLast = new Date().toISOString(); await refreshEcl(); render();
    toast(files.length ? `Downloaded ${s.downloaded} new files. ${ras} remittances posted AED ${aed(paid)} to ${claims} claims`+(pas?`, ${pas} approval replies recorded`:"")+(unknown.length?`. Not matched: ${unknown.slice(0,4).join(", ")}${unknown.length>4?"…":""}`:"")+(s.errors.length?`. ${s.errors.length} files failed`:"")

  } catch(e){ toast("eClaimLink download failed: " + e.message); render(); }
}

/* ---------- shared records ---------- */
// Only what changed since the last save goes to the server: each claim, patient, remittance, approval and
// appointment on its own, so two people working on different records never overwrite each other.
function syncChanges(){
  const upserts = [], deletes = [], settings = {};
  for (const c of COLLS){
    const base = SYNC.base[c] || (SYNC.base[c] = new Map()), seen = new Set();
    for (const r of S[c] || []){ const id = String(r.id); seen.add(id); const j = JSON.stringify(r); if (base.get(id) !== j) upserts.push({coll:c, id, data:r, j}); }
    for (const id of base.keys()) if (!seen.has(id)) deletes.push({coll:c, id});
  }
  for (const k of Object.keys(S)) if (!COLLS.includes(k) && k !== "log"){ const j = JSON.stringify(S[k]); if (SYNC.set[k] !== j) settings[k] = S[k]; }
  if (JSON.stringify(PRICES) !== SYNC.prices) settings.prices = PRICES;
  return {upserts, deletes, settings, log: S.log.filter(l => !SYNC.logs.has(l))};
}
const syncPost = (ch, extra = {}) => api("/data", {...extra, upserts: ch.upserts.map(({coll,id,data}) => ({coll,id,data})), deletes: ch.deletes, settings: ch.settings, log: ch.log.map(l => ({...l, _c:CLIENT}))});
async function syncNow(){
  if (!SYNC.ready) return;
  if (SYNC.busy){ SYNC.again = true; return; }
  SYNC.busy = true; clearTimeout(SYNC.timer);
  try {
    if (SYNC.dirty){
      SYNC.dirty = false;
      const ch = syncChanges();
      if (ch.upserts.length || ch.deletes.length || ch.log.length || Object.keys(ch.settings).length){
        try { await syncPost(ch); } catch(e){ SYNC.dirty = true; throw e; }
        ch.upserts.forEach(u => SYNC.base[u.coll].set(u.id, u.j));
        ch.deletes.forEach(d => SYNC.base[d.coll].delete(d.id));
        for (const k in ch.settings) if (k === "prices") SYNC.prices = JSON.stringify(ch.settings[k]); else SYNC.set[k] = JSON.stringify(ch.settings[k]);
        ch.log.forEach(l => SYNC.logs.add(l));
      }
    }
    if (await syncPull()) rerender();
    else if (SYNC.stale) rerender();
    syncState(true);
  } catch(e){ syncState(false, e); }
  SYNC.busy = false;
  if (SYNC.again || SYNC.dirty){ SYNC.again = false; SYNC.timer = setTimeout(syncNow, SYNC.ok ? 50 : 5000); }
}
// Other people's changes. A record edited here and not yet saved keeps this browser's version, which is saved next.
async function syncPull(){
  const d = await api("/data?since=" + SYNC.rev);
  let changed = false;
  for (const ch of d.changes){
    const j = ch.data === null ? undefined : JSON.stringify(ch.data);
    if (ch.coll === "_"){
      if (ch.id === "prices"){ const dirty = JSON.stringify(PRICES) !== SYNC.prices; SYNC.prices = j; if (!dirty && j){ PRICES = ch.data; priceIdx = null; changed = true; } continue; }
      const local = JSON.stringify(S[ch.id]), dirty = local !== SYNC.set[ch.id];
      SYNC.set[ch.id] = j;
      if (!dirty && local !== j){ if (j === undefined) S[ch.id] = emptyState()[ch.id]; else S[ch.id] = ch.data; if (S[ch.id] === undefined) delete S[ch.id]; changed = true; }
      continue;
    }
    if (!COLLS.includes(ch.coll)) continue;
    const base = SYNC.base[ch.coll] || (SYNC.base[ch.coll] = new Map()), arr = S[ch.coll], i = arr.findIndex(r => String(r.id) === ch.id);
    const local = i < 0 ? undefined : JSON.stringify(arr[i]), dirty = local !== base.get(ch.id);
    if (j === undefined) base.delete(ch.id); else base.set(ch.id, j);
    if (dirty || local === j) continue;
    if (j === undefined) arr.splice(i, 1);
    else if (i >= 0) arr[i] = ch.data;
    else if (ch.coll === "patients" || ch.coll === "claims") arr.push(ch.data); else arr.unshift(ch.data);
    changed = true;
  }
  for (const l of d.log.slice().reverse()) if (l._c !== CLIENT){ delete l._c; S.log.unshift(l); SYNC.logs.add(l); changed = true; }
  if (S.log.length > 500) S.log.length = 500;
  SYNC.rev = d.rev;
  return changed;
}
// Someone else's change shows at once, unless this person is typing or has a window open: then it waits
function rerender(){
  const a = document.activeElement;
  if (dlg.open || (a && a.closest && a.closest("#view") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){ SYNC.stale = true; return; }
  SYNC.stale = false; render();
}
function syncState(ok, err){
  if (ok === SYNC.ok) return;
  SYNC.ok = ok;
  if (!ok) toast("Changes are not saved yet: the clinic server cannot be reached. Retrying…");
  else toast("Connected to the clinic server again. Changes saved.");
  renderSync();
}
function renderSync(){
  const el = $("#syncText"); if (!el) return;
  el.innerHTML = !SHARED ? "All figures in AED. Claims and payments are stored in this browser."
    : SYNC.ok ? `All figures in AED. Records are saved on the clinic server and shared by all staff.${SYNC.me?` Signed in as <b>${esc(SYNC.me.name||SYNC.me.username)}</b>${SYNC.me.role==="admin"?" (admin)":""}.`:""}`
    : `<span style="color:var(--bad)">Not saved: the clinic server cannot be reached. Retrying…</span>`;
}
async function bootShared(){
  try { SYNC.me = await api("/me"); } catch(e){ toast("Clinic server not reachable: " + e.message); return; }
  try { await syncPull(); } catch(e){ toast("Could not load the shared records: " + e.message); return; }
  SYNC.ready = true; renderSync();
  // Records this browser kept before they moved to the server: copy across the ones the server does not have yet
  let asked = null; try { asked = localStorage.getItem(KEY + "-copied"); } catch(e) {}
  if ((OLD_LOCAL || OLD_PRICES) && !asked){
    const o = OLD_LOCAL || emptyState();
    if (confirm(`This browser still has its own copy of the records from before they were shared (${o.claims.length} claims, ${o.ras.length} remittances, ${o.patients.length} patients${OLD_PRICES?", price lists":""}).\n\nCopy the ones that are missing to the clinic server, so all staff see them? Records already on the server are not changed.`)){
      try {
        const all = [];
        for (const c of COLLS) for (const r of o[c] || []) all.push({coll:c, id:String(r.id), data:r});
        for (let i = 0; i < all.length; i += 300) await api("/data", {onlyNew:true, upserts: all.slice(i, i + 300)});
        const settings = {}; for (const k of Object.keys(o)) if (!COLLS.includes(k) && k !== "log") settings[k] = o[k];
        if (OLD_PRICES) settings.prices = OLD_PRICES;
        await api("/data", {onlyNew:true, settings, log: (o.log || []).slice(0, 200)});
        await syncPull();
        try { localStorage.removeItem(KEY); localStorage.removeItem(PRICE_KEY); localStorage.setItem(KEY + "-copied", "yes"); } catch(e) {}
        toast(`Copied ${all.length} records to the clinic server`);
      } catch(e){ toast("Copying to the clinic server failed: " + e.message + ". It will be offered again next time."); }
    } else { try { localStorage.setItem(KEY + "-copied", "declined"); } catch(e) {} }
  }
  setInterval(() => { if (!document.hidden) syncNow(); }, 10000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
  dlg.addEventListener("close", () => { if (SYNC.stale) setTimeout(rerender, 0); });
  window.addEventListener("beforeunload", e => { if (SYNC.dirty || SYNC.busy){ syncNow(); e.preventDefault(); e.returnValue = ""; } });
  render();
}

  } else if (name && /^Member |^Unnamed/.test(p.name)) p.name = name;

}

// Imports a mix of CSV and XML texts; returns one summary line
function importClaimFiles(list, draft){
  const tally = {added:0, updated:0, existing:0, posted:[], skipped:[]};
  for (const f of list){
    const t = f.text.replace(/^\uFEFF/, "").trim();
    if (!t) continue;
    if (!t.startsWith("<")){ const r = importClaimsCsv(t); if (r.error){ tally.skipped.push(`${f.name}: ${r.error}`); continue; }
      tally.added += r.added; tally.updated += r.updated; tally.existing += r.existing; tally.skipped.push(...r.skipped); continue; }
    const doc = new DOMParser().parseFromString(t, "application/xml");
    if (doc.getElementsByTagName("parsererror").length){ tally.skipped.push(`${f.name}: not valid XML`); continue; }
    const type = doc.documentElement.tagName;
    if (type === "Claim.Submission"){ const r = addClaimsFromXml(t, {draft, file:f.name}); tally.added += r.added; tally.updated += r.updated; tally.existing += r.skipped; }
    else if (["Remittance.Advice","Prior.Request","Prior.Authorization"].includes(type)){ const r = applyEclFile("F:"+f.name+":"+t.length, type, t, f.name); tally.posted.push(`${f.name}: ${r.msg}`); }
    else tally.skipped.push(`${f.name}: ${type} files are not supported`);
  }
  save();
  return tally;
}
function importClaimsCsv(txt){
  const rows = parseCsv(txt); if (!rows.length) return {error:"The file is empty."};
  let hdr = rows[0].map(h => h.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,""));
  if (hdr.includes("claim_id")) rows.shift(); else hdr = CLAIM_COLS.split(",");
  const col = (r,k) => { const i = hdr.indexOf(k); return i < 0 ? "" : (r[i]||"").trim(); };
  const groups = new Map(), skipped = [];
  rows.forEach((r,i) => { const id = col(r,"claim_id"); if (!id){ skipped.push(`line ${i+2}: no claim_id`); return; } if (!groups.has(id)) groups.set(id,[]); groups.get(id).push(r); });
  let added = 0, existing = 0, updated = 0;
  for (const [id, rs] of groups){
    const old = claimById(id);
    // A draft that is imported again is replaced, so corrections made in the clinic system come through
    if (old && old.status !== "Draft"){ existing++; continue; }
    const r0 = rs[0], pid = payerFrom(col(r0,"payer"));
    if (!pid){ skipped.push(`${id}: unknown payer "${col(r0,"payer")}"`); continue; }
    const enc = isoDate(col(r0,"encounter_date"));
    if (!enc){ skipped.push(`${id}: missing or invalid encounter_date`); continue; }
    const pt = findOrAddPatient({name:col(r0,"patient_name"), eid:col(r0,"emirates_id"), card:col(r0,"card_no"), payerId:pid});
    const acts = rs.map((r,k) => { const g = num(col(r,"gross")), ps = num(col(r,"patient_share"));
      return {aid:`${id}-${k+1}`, code:col(r,"cpt"), desc:col(r,"description"), qty:Math.max(1,parseInt(col(r,"quantity"))||1), gross:r2(g), ps:r2(ps), net:r2(g-ps), paid:0, denial:null}; });
    const dx = [...new Set(rs.flatMap(r => col(r,"icd10").split(/[;|]/).map(x=>x.trim()).filter(Boolean)))].map(c => [c,""]);
    const submitted = /^submit/i.test(col(r0,"status")) ? (isoDate(col(r0,"submitted_date")) || enc) : null;
    const c = {id, patient:pt.id, payer:pid, card:col(r0,"card_no")||pt.policy.card, dept:col(r0,"department")||"–", doctor:col(r0,"doctor")||"",
      enc, dx:dx.length?dx:[["",""]], acts, status:submitted?"Submitted":"Draft", submitted, events:[{d:enc,t:"Imported from clinic system"}], remits:[], resubs:[], writeOff:0, woReason:null, pa:col(r0,"prior_auth")||null};
    if (submitted) c.events.push({d:submitted,t:"Submitted to "+payer(pid).name});
    if (old){ S.claims[S.claims.indexOf(old)] = c; updated++; } else { S.claims.push(c); added++; }
  }
  save();
  return {added, existing, updated, skipped};
}
const dhpoToIso = v => { const m = String(v||"").match(/^(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : null; };
// Claim.Submission files you sent through eClaimLink become claims here, so remittances can match them
// draft: the file has not been sent yet (an export from the clinic system), so the claims start as drafts to check
function addClaimsFromXml(xml, {draft = false, file = ""} = {}){
  const doc = new DOMParser().parseFromString(xml,"application/xml");
  const own = (el,t) => { const x = [...el.children].find(c => c.tagName === t); return x ? x.textContent.trim() : ""; };
  const header = doc.getElementsByTagName("Header")[0];
  const sent = (header && dhpoToIso(own(header,"TransactionDate"))) || TODAY, receiver = header ? own(header,"ReceiverID") : "";
  // Claims imported from a file keep their original XML, so they can be submitted, resubmitted or downloaded as they came (with lab results added)
  const ser = el => new XMLSerializer().serializeToString(el), headerXml = file && header ? ser(header) : "";
  let added = 0, updated = 0, skipped = 0;
  [...doc.getElementsByTagName("Claim")].forEach(ce => {
    const id = own(ce,"ID"); if (!id) return;
    const resub = ce.getElementsByTagName("Resubmission")[0];
    const ex = claimById(id);
    if (ex && !(draft && ex.status === "Draft")){
      if (resub && !ex.resubs.some(x => x.d === sent)){ const note = resub.getElementsByTagName("Comment")[0];
        ex.resubs.push({d:sent,type:(resub.getElementsByTagName("Type")[0]||{}).textContent||"correction",note:note?note.textContent:"",amount:totals(ex).outstanding,codes:[...new Set(ex.acts.map(a=>a.denial).filter(Boolean))],outcome:null});
        ex.status = "Resubmitted"; ex.events.push({d:sent,t:"Resubmission found on eClaimLink"}); updated++; }
      else skipped++;
      return;
    }
    const pid = payerFrom(own(ce,"PayerID")) || payerFrom(receiver) || own(ce,"PayerID") || receiver;
    const enc = ce.getElementsByTagName("Encounter")[0];
    const encDate = (enc && dhpoToIso(own(enc,"Start"))) || sent;
    const pt = findOrAddPatient({eid:own(ce,"EmiratesIDNumber"), card:own(ce,"MemberID"), payerId:pid});
    const claimNet = num(own(ce,"Net")), claimPs = num(own(ce,"PatientShare"));
    const actEls = [...ce.getElementsByTagName("Activity")];
    const acts = actEls.map((a,k) => { const net = num(own(a,"Net")), ps = claimNet ? r2(claimPs*net/claimNet) : 0;
      const obs = [...a.getElementsByTagName("Observation")].map(o => ({type:own(o,"Type"), code:own(o,"Code"), value:own(o,"Value"), unit:own(o,"ValueType")}));
      return {aid:own(a,"ID")||`${id}-${k+1}`, code:own(a,"Code"), type:own(a,"Type"), obs, desc:"", qty:num(own(a,"Quantity"))||1, gross:r2(net+ps), ps, net:r2(net), paid:0, denial:null}; });
    const dx = [...ce.getElementsByTagName("Diagnosis")].map(d => [own(d,"Code"), ""]);
    const c = {id, patient:pt.id, payer:pid, card:own(ce,"MemberID"), dept:"–", doctor:actEls[0]?own(actEls[0],"Clinician"):"", enc:encDate,
      dx:dx.length?dx:[["",""]], acts, status:draft?"Draft":resub?"Resubmitted":"Submitted", submitted:draft?null:sent,
      events:draft?[{d:encDate,t:"Encounter"},{d:TODAY,t:"Imported from XML file"}]:[{d:encDate,t:"Encounter"},{d:sent,t:"Claim file found on eClaimLink"}],
      remits:[], resubs:resub&&!draft?[{d:sent,type:(resub.getElementsByTagName("Type")[0]||{}).textContent||"correction",note:"",amount:r2(claimNet),codes:[],outcome:null}]:[], writeOff:0, woReason:null,
      pa:actEls.map(a=>own(a,"PriorAuthorizationID")).find(Boolean)||null};
    if (receiver) c.tpa = receiver;
    if (file){ c.srcXml = ser(ce); c.srcHeader = headerXml; c.srcFile = file; }
    if (ex){ S.claims[S.claims.indexOf(ex)] = c; updated++; } else { S.claims.push(c); added++; }
  });
  return {added, updated, skipped};
}
function addAuthsFromXml(xml){
  const doc = new DOMParser().parseFromString(xml,"application/xml");
  const own = (el,t) => { const x = [...el.children].find(c => c.tagName === t); return x ? x.textContent.trim() : ""; };
  let added = 0;
  [...doc.getElementsByTagName("Authorization")].forEach(au => {
    const id = own(au,"ID"); if (!id || S.auths.some(a => a.id === id)) return;
    const pid = payerFrom(own(au,"PayerID")) || own(au,"PayerID");
    const pt = findOrAddPatient({eid:own(au,"EmiratesIDNumber"), card:own(au,"MemberID"), payerId:pid});
    const acts = [...au.getElementsByTagName("Activity")], dx = au.getElementsByTagName("Diagnosis")[0];
    S.auths.unshift({id, patient:pt.id, payer:pid, dept:"–", code:acts.map(a=>own(a,"Code")).join(", "), desc:"", dx:dx?own(dx,"Code"):"",
      requested:r2(acts.reduce((s,a)=>s+num(own(a,"Net")),0)), approved:0, status:"Pending", reqOn:dhpoToIso(own(au,"DateOrdered"))||TODAY, respOn:null, validTo:null, claim:null, note:"Found on eClaimLink"});
    added++;
  });
  return added;
}
// Puts one eClaimLink file into this system's records, once
function applyEclFile(key, type, xml, name){
  if (S.posted[key]) return {done:false, msg:`already in your records since ${fmtD(S.posted[key])}`};
  let msg;
  if (type === "Claim.Submission"){ const r = addClaimsFromXml(xml); msg = `${r.added} claims added`+(r.updated?`, ${r.updated} resubmissions recorded`:"")+(r.skipped?`, ${r.skipped} already here`:""); }
  else if (type === "Remittance.Advice"){ const r = importRa(xml,{quiet:true,source:"eClaimLink "+(name||key)}); msg = typeof r === "string" ? r : `AED ${aed(r.total)} posted to ${r.count} claims`+(r.unknown.length?`, ${r.unknown.length} claims not in your records`:""); }
  else if (type === "Prior.Request"){ msg = `${addAuthsFromXml(xml)} approval requests added`; }
  else if (type === "Prior.Authorization"){ msg = `${applyPriorAuth(xml)} approval replies recorded`; }
  else return {done:false, msg:`${type} files are view only`};
  S.posted[key] = TODAY; save();
  return {done:true, msg};
}

function ovRange(p){
  const d = new Date(TODAY+"T00:00:00"), iso = x => toISO(x);
  if (p === "30" || p === "90") return [addDays(TODAY, -Number(p)), TODAY];
  if (p === "month") return [iso(new Date(d.getFullYear(), d.getMonth(), 1)), TODAY];
  if (p === "lastmonth") return [iso(new Date(d.getFullYear(), d.getMonth()-1, 1)), iso(new Date(d.getFullYear(), d.getMonth(), 0))];
  if (p === "year") return [iso(new Date(d.getFullYear(), 0, 1)), TODAY];

// The claim file for download. Claims imported from a file are written back exactly as they came,
// with only their observations replaced; other claims are built from the record.
function obsXml(doc, o, ind){
  const el = doc.createElement("Observation");
  for (const [t, v] of [["Type", o.type||"LOINC"], ["Code", o.code||""], ["Value", o.value], ["ValueType", o.unit||""]]){
    el.appendChild(doc.createTextNode("\n" + ind + "  ")); const x = doc.createElement(t); x.textContent = v; el.appendChild(x); }
  el.appendChild(doc.createTextNode("\n" + ind)); return el;
}
// Writes corrections made with Correct claim into the original claim XML: member, payer, totals, encounter date,
// diagnoses and activities. Fields that were not corrected keep their original text.
function applyCorrections(doc, ce, c){
  const kids = (el, tag) => [...el.children].filter(x => x.tagName === tag);
  const setText = (el, tag, v) => { const x = kids(el, tag)[0]; if (x) x.textContent = v; return !!x; };
  const dmy = iso => iso.split("-").reverse().join("/"), t = totals(c);
  setText(ce, "MemberID", c.card || ""); setText(ce, "PayerID", c.payer || "");
  setText(ce, "Gross", t.gross.toFixed(2)); setText(ce, "PatientShare", t.ps.toFixed(2)); setText(ce, "Net", t.net.toFixed(2));
  const newDate = el => { const x = kids(el, "Start")[0]; if (x && c.enc) x.textContent = dmy(c.enc) + (x.textContent.trim().slice(10) || " 09:00"); };
  const enc = kids(ce, "Encounter")[0]; if (enc) { newDate(enc); const e = kids(enc, "End")[0]; if (e && c.enc) e.textContent = dmy(c.enc) + (e.textContent.trim().slice(10) || " 10:00"); }
  // Diagnoses: rewrite the list in place of the old one
  const dxs = kids(ce, "Diagnosis"), anchor = dxs.length ? dxs[0] : kids(ce, "Activity")[0] || null, ind = "\n    ";
  if (dxs.length || anchor) {
    c.dx.forEach((d, i) => { const el = doc.createElement("Diagnosis");
      for (const [k, v] of [["Type", i ? "Secondary" : "Principal"], ["Code", d[0]]]) { el.appendChild(doc.createTextNode(ind + "  ")); const x = doc.createElement(k); x.textContent = v; el.appendChild(x); }
      el.appendChild(doc.createTextNode(ind)); ce.insertBefore(el, anchor); ce.insertBefore(doc.createTextNode(ind), anchor); });
    dxs.forEach(x => { const p = x.previousSibling; if (p && p.nodeType === 3 && !p.textContent.trim()) p.remove(); x.remove(); });
  }
  // Activities: update, remove, and add (a new one copies the first activity's layout)
  const els = kids(ce, "Activity"), idOf = el => (kids(el, "ID")[0] || {textContent:""}).textContent.trim();
  const first = els[0];
  for (const el of els) { const a = c.acts.find(x => x.aid === idOf(el));
    if (!a) { const p = el.previousSibling; if (p && p.nodeType === 3 && !p.textContent.trim()) p.remove(); el.remove(); continue; }
    setText(el, "Code", a.code); setText(el, "Quantity", String(a.qty)); setText(el, "Net", r2(a.net).toFixed(2)); newDate(el);
    if (c.doctor) setText(el, "Clinician", c.doctor);
    // DHA order: ... Clinician, PriorAuthorizationID, Observation
    if (c.pa && !setText(el, "PriorAuthorizationID", c.pa)) { const x = doc.createElement("PriorAuthorizationID"); x.textContent = c.pa;
      const ref = kids(el, "Observation")[0] || (kids(el, "Clinician")[0] || {}).nextSibling || null;
      el.insertBefore(doc.createTextNode(ind + "  "), ref); el.insertBefore(x, ref); }
  }
  let after = kids(ce, "Activity").pop() || null;
  for (const a of c.acts.filter(a => !els.some(el => idOf(el) === a.aid))) {
    let el;
    if (first) { el = first.cloneNode(true); kids(el, "Observation").forEach(x => x.remove()); setText(el, "ID", a.aid); setText(el, "Code", a.code); setText(el, "Quantity", String(a.qty)); setText(el, "Net", r2(a.net).toFixed(2)); setText(el, "Type", a.type || "3"); newDate(el); if (c.doctor) setText(el, "Clinician", c.doctor); }
    else { el = doc.createElement("Activity");
      for (const [k, v] of [["ID", a.aid], ["Start", dmy(c.enc) + " 09:00"], ["Type", a.type || "3"], ["Code", a.code], ["Quantity", String(a.qty)], ["Net", r2(a.net).toFixed(2)], ["Clinician", c.doctor || ""]]) { el.appendChild(doc.createTextNode(ind + "  ")); const x = doc.createElement(k); x.textContent = v; el.appendChild(x); }
      el.appendChild(doc.createTextNode(ind)); }
    const ref = after ? after.nextSibling : null;
    ce.insertBefore(doc.createTextNode(ind), ref); ce.insertBefore(el, ref); after = el;
  }
}
function claimSrcXml(c, resub){
  const doc = new DOMParser().parseFromString(c.srcXml, "application/xml"), ce = doc.documentElement;

  [...ce.children].filter(x => x.tagName === "Resubmission").forEach(x => { const p = x.previousSibling; if (p && p.nodeType === 3 && !p.textContent.trim()) p.remove(); x.remove(); });
  if (resub){
    const el = doc.createElement("Resubmission");
    for (const [t, v] of [["Type", resub.type], ["Comment", resub.note]]){ el.appendChild(doc.createTextNode("\n      ")); const x = doc.createElement(t); x.textContent = v; el.appendChild(x); }
    el.appendChild(doc.createTextNode("\n    "));
    const contract = [...ce.children].find(x => x.tagName === "Contract");
    ce.insertBefore(doc.createTextNode("\n    "), contract || ce.lastChild); ce.insertBefore(el, contract || ce.lastChild);
    if (contract) ce.insertBefore(doc.createTextNode("\n    "), contract);

    const last = ae.lastChild, ind = last && last.nodeType === 3 ? last.textContent.replace(/^[\s\S]*\n/, "") : "    ";
    if (last && last.nodeType === 3) last.remove();
    for (const o of (a.obs||[]).filter(o => o.value)){ ae.appendChild(doc.createTextNode("\n" + ind + "  ")); ae.appendChild(obsXml(doc, o, ind + "  ")); }

function claimFileXml(list, {fresh = false, resub = null} = {}){

  }

  if (fresh) headerXml = headerXml.replace(/<TransactionDate>[^<]*<\/TransactionDate>/, `<TransactionDate>${dtX(TODAY)} ${nowTime()}</TransactionDate>`);

// Each payer's contracted prices, uploaded as CSV or Excel. Kept in this browser under their own key, so a large
// list does not slow down saving claims. The claim check compares every activity with the payer's list.
const PRICE_KEY = "rcm-prices";
let PRICES;
try { PRICES = JSON.parse(localStorage.getItem(PRICE_KEY)) || {lists:{}}; } catch(e) { PRICES = {lists:{}}; }
const OLD_PRICES = SHARED && Object.keys(PRICES.lists).length ? PRICES : null;
if (SHARED) PRICES = {lists:{}};
let priceIdx = null; // payer key -> Map(code -> [price, desc])
function savePrices(){
  priceIdx = null;
  if (SHARED){ save(); return true; }
  try { localStorage.setItem(PRICE_KEY, JSON.stringify(PRICES)); return true; }
  catch(e) { toast("The price lists are too large for this browser's storage. Remove an old list or upload fewer columns."); return false; }
}
const normCode = v => String(v ?? "").trim().toUpperCase();
function priceIndex(){
  if (priceIdx) return priceIdx;
  priceIdx = {};
  for (const [k, l] of Object.entries(PRICES.lists)) priceIdx[k] = new Map(l.items.map(([code, price, desc]) => [normCode(code), [price, desc]]));
  return priceIdx;
}
// The list for a claim's payer: the payer's own list (matched by code or by the payer it maps to), else the facility list "*"
function priceListFor(payerId){
  const keys = Object.keys(PRICES.lists);
  const k = keys.find(k => k !== "*" && (k === payerId || payerFrom(k) === payerId || k === payerFrom(payerId))) || (PRICES.lists["*"] ? "*" : null);
  return k ? {key:k, list:PRICES.lists[k], idx:priceIndex()[k]} : null;
}
const priceListName = k => k === "*" ? "facility price list" : `${PRICES.lists[k] && PRICES.lists[k].name ? `${k} · ${PRICES.lists[k].name}` : payerText(k)} price list`;
// Billed amounts are compared per unit. Gross is compared with the list price, net with the price after the payer's discount;
// a match on either is fine. Above both is a price rejection risk (error); below is lost revenue (warning).
function priceIssues(c){
  const pl = priceListFor(c.payer); if (!pl) return [];
  const out = [], disc = Number(pl.list.disc) || 0, name = priceListName(pl.key);

    const code = normCode(a.code); if (!code || !(a.gross > 0)) continue;
    const hit = pl.idx.get(code), qty = a.qty || 1;
    if (!hit){ if (!isServiceCode(a)) out.push({level:"warn", code:"PRICE", price:true, msg:`Activity ${a.code} is not on the ${name}.`}); continue; }
    const price = hit[0], exNet = r2(price * (1 - disc/100)), g = r2(a.gross/qty), n = r2((a.net + (a.ps||0))/qty), n2 = r2(a.net/qty);
    if ([g, n, n2].some(v => Math.abs(v - price) <= 0.01 || Math.abs(v - exNet) <= 0.01)) continue;
    const over = Math.min(g, n2) > Math.max(price, exNet) + 0.01;
    out.push({level: over ? "error" : "warn", code:"PRICE", price:true,
      msg:`Activity ${a.code}${hit[1] ? ` (${hit[1]})` : ""}: billed AED ${aed(g)} per unit, the ${name} has AED ${aed(price)}${disc ? ` (AED ${aed(exNet)} after ${disc}% discount)` : ""}. ${over ? "Billed above the contract price: likely price rejection." : "Billed below the contract price."}`});
  }
  return out;
}

async function pdfRows(file){
  const lib = await loadPdf(), pdf = await lib.getDocument({data: await file.arrayBuffer()}).promise, rows = [];
  for (let n = 1; n <= pdf.numPages; n++){
    const items = (await (await pdf.getPage(n)).getTextContent()).items.filter(i => i.str.trim());
    const lines = [];
    for (const it of items){ const y = it.transform[5], l = lines.find(l => Math.abs(l.y - y) < 3); (l || (lines[lines.length] = {y, items:[]})).items.push(it); }
    lines.sort((a,b) => b.y - a.y);
    for (const l of lines){
      l.items.sort((a,b) => a.transform[4] - b.transform[4]);
      const cells = []; let end = -1e9;
      for (const it of l.items){ const x = it.transform[4], h = Math.abs(it.transform[3]) || 10;
        if (cells.length && x - end < h * 0.9) cells[cells.length-1] += (x - end > h * 0.15 ? " " : "") + it.str; else cells.push(it.str);
        end = x + it.width; }
      rows.push(cells.map(c => c.trim()));
    }
  }
  if (!rows.length) throw new Error(`${file.name} has no readable text. It may be a scanned PDF; save the data as CSV or Excel instead.`);
  return rows;
}

async function readSheet(file){
  if (/\.xlsx?$/i.test(file.name)){ const X = await loadXlsx(); const wb = X.read(await file.arrayBuffer(), {type:"array"});
    const ws = wb.SheetNames.map(n => wb.Sheets[n]).find(w => w["!ref"]) || wb.Sheets[wb.SheetNames[0]];
    return X.utils.sheet_to_json(ws, {header:1, raw:false, defval:"", dateNF:"yyyy-mm-dd"}).map(r => r.map(v => String(v))).filter(r => r.some(c => c.trim())); }

// Finds the code, price and description columns by their headings
function parsePriceRows(rows){
  const isHead = r => r.some(c => /code|cpt|service/i.test(c)) && r.some(c => /price|tariff|rate|amount|net|gross|aed/i.test(c));
  const h = rows.findIndex(isHead);
  let ci = 0, pi = 1, di = -1, start = 0;
  if (h >= 0){ const head = rows[h].map(c => c.trim().toLowerCase()); start = h + 1;
    ci = head.findIndex(c => /^(activity |service |cpt |item )?code$|^cpt|code/.test(c));
    pi = head.findIndex(c => /price|tariff|rate/.test(c)); if (pi < 0) pi = head.findIndex(c => /gross|amount|net|aed/.test(c));
    di = head.findIndex(c => /desc|name|service$/.test(c) && !/code/.test(c)); }
  const items = [], bad = [];
  for (const r of rows.slice(start)){
    const code = normCode(r[ci]), price = Number(String(r[pi] ?? "").replace(/[^\d.-]/g, ""));
    if (!code) continue;
    if (!isFinite(price) || String(r[pi] ?? "").trim() === "") { bad.push(code); continue; }
    items.push([code, r2(price), di >= 0 ? String(r[di] || "").trim().slice(0, 80) : ""]);
  }
  return {items, bad, cols:{code:ci, price:pi, desc:di}};
}

function downloadFile(name, text, type = "text/csv"){
  const blob = new Blob([type === "text/csv" ? "\uFEFF" + text : text], {type: type + ";charset=utf-8"});
  const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(blob), download: name});
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("Downloaded " + name);
}

function bindEcl(v){
  bindEclAccount();
  const back = $("#eclBackToSignIn"); if (back) back.onclick = () => { UI.eclTest = false; render(); };
  const u = UI.ecl;
  const f = $("#eclForm"); if (!f) return;
  f.onsubmit = async e => { e.preventDefault();
    Object.assign(u, {direction:$("#eDir").value, type:$("#eType").value, status:$("#eStatus").value, from:$("#eFrom").value, to:$("#eTo").value, name:$("#eName").value.trim(), archive:$("#eArch").checked, busy:"search", report:null});
    render();
    try { const q = new URLSearchParams({direction:u.direction, type:u.type, status:u.status, from:u.from, to:u.to}); if (u.name) q.set("name",u.name); if (u.archive) q.set("archive","1");
      const r = await api("/eclaimlink/search?"+q); u.results = r.files.map(x=>({...x, archive:u.archive})); u.notes = r.notes; }
    catch(err){ toast(err.message); }
    u.busy = ""; render(); };
  v.querySelectorAll("[data-eview]").forEach(el => { el.onclick = () => eclViewDlg(Number(el.dataset.eview)); el.onkeydown = e => { if (e.key==="Enter") eclViewDlg(Number(el.dataset.eview)); }; });
  const rep = $("#eReport");
  if (rep) rep.onclick = async () => { u.busy = "report"; render();
    try { u.report = await api("/eclaimlink/report",{files:u.results.map(x=>({fileId:x.fileId, archive:x.archive}))}); } catch(err){ toast(err.message); }
    u.busy = ""; render(); };
  const csv = $("#eReportCsv");
  if (csv) csv.onclick = () => { const t = reportCsv(u.report); try { navigator.clipboard.writeText(t).then(()=>toast("Report copied as CSV"),()=>{}); } catch(e){} };
  const stamp = () => `${u.direction}_${u.from}_to_${u.to}`;
  const rdl = $("#eReportDl"); if (rdl) rdl.onclick = () => downloadFile(`eclaimlink_report_${stamp()}.csv`, reportCsv(u.report));
  const rpr = $("#eReportPrint"); if (rpr) rpr.onclick = () => { document.body.dataset.print = "report"; window.print(); delete document.body.dataset.print; };
  const ldl = $("#eListDl"); if (ldl) ldl.onclick = () => downloadFile(`eclaimlink_files_${stamp()}.csv`, filesCsv(u.results, u.direction));
  const all = $("#eLoadAll");
  if (all) all.onclick = async () => {
    const order = {"Claim.Submission":0,"Prior.Request":1,"Remittance.Advice":2,"Prior.Authorization":3};
    const todo = u.results.filter(x => !S.posted[fileKey(x)] && x.type in order)
      .sort((a,b) => order[a.type]-order[b.type] || dhpoKey(a.transactionDate).localeCompare(dhpoKey(b.transactionDate)));
    u.busy = "load"; render();
    let ok = 0; const fails = [];
    for (const x of todo){
      try { const v2 = await api(`/eclaimlink/remote/${encodeURIComponent(x.fileId)}${x.archive?"?archive=1":""}`); if (applyEclFile(fileKey(x), v2.summary.type, v2.xml, x.fileName).done) ok++; }
      catch(err){ fails.push(x.fileName||x.fileId); }
    }
    u.busy = ""; render();
    toast(`Added ${ok} file${ok===1?"":"s"} to your records`+(fails.length?`. ${fails.length} could not be opened`:""));
  };
}
const dhpoKey = d => d ? `${d.slice(6,10)}${d.slice(3,5)}${d.slice(0,2)}${d.slice(11)}` : "";

/* ---------- boot ---------- */
$("#facilityBtn").onclick = facilityDlg;
$("#nav").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });
let resetArm = 0;
$("#resetBtn").onclick = async () => { const b = $("#resetBtn");
  if (SHARED && (!SYNC.me || SYNC.me.role !== "admin")) return toast("Only an admin can clear all data");
  if (Date.now()-resetArm < 4000){
    resetArm=0; b.textContent="Clear all data";
    if (SHARED){ try { await api("/data", {clearAll:true}); } catch(e){ return toast("Not cleared: " + e.message); }
      S = emptyState(); PRICES = {lists:{}}; priceIdx = null; SYNC.base = {}; SYNC.set = {}; SYNC.prices = undefined; SYNC.dirty = true; SYNC.rev = 0; await syncNow(); UI.verifyResult=null; render(); toast("All records were cleared for everyone. Yesterday's copy is in data\\backups on the clinic computer."); return; }
    S = emptyState(); UI.verifyResult=null; save(); render(); toast("All records on this computer were cleared"); } else { resetArm = Date.now(); b.textContent = "Click again to clear everything"; setTimeout(()=>{ b.textContent="Clear all data"; }, 4000); } };
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h!==current && R[h]) { current = h; render(); } });
save(); render(); renderSync();
if (API_BASE) bootLive();
})();
</script>
